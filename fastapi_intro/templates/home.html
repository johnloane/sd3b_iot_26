{% extends "layout.html" %}
{% block content %}
  {% for sensor_reading in sensor_readings %}
    <article class="content-section py-3 px-4 mb-4">
      <div class="d-flex align-items-start gap-4">
        <img class="rounded-circle article-img flex-shrink-0"
             src="{{ sensor_reading.author.image_path}}"
             alt="{{ sensor_reading.author.name }}'s profile picture"
             width="64"
             height="64"
             loading="lazy">
        <div class="flex-grow-1">
          <div class="article-metadata mb-2">
            <a class="me-2" href="{{url_for('user_readings', user_id=reading.author.id)}}">{{ sensor_reading.author.name }}</a>
            <small class="text-body-secondary">{{ sensor_reading.date_timestamp.strftime('%d %B, %Y')}}</small>
          </div>
          <h2>
            <a class="article-title"
               href="{{ url_for("sensor_reading_page", sensor_reading_id=sensor_reading.id) }}">{{ sensor_reading.sensor }}</a>
          </h2>
          <p class="article-content">{{ sensor_reading.content }}</p>
        </div>
      </div>
    </article>
  {% endfor %}
{% endblock content %}
